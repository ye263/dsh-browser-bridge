<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Browser Bridge</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; background: #14161a; color: #e8e8ea; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #262a31; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff6b6b; }
  .dot.on { background: #37d67a; }
  nav { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #262a31; }
  nav button { flex: 1; }
  nav button.on { border-color: #4a5261; background: #262b34; color: #fff; }
  section { padding: 10px 12px; border-bottom: 1px solid #262a31; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .mut { color: #9aa0aa; }
  input, button, textarea { background: #1d2026; color: #e8e8ea; border: 1px solid #303540; border-radius: 6px; padding: 5px 7px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: #4a5261; }
  button.on { border-color: #4a5261; background: #262b34; color: #fff; }
  #log { max-height: 40vh; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .e { padding: 3px 0; border-bottom: 1px dotted #262a31; white-space: pre-wrap; word-break: break-word; }
  .k-ok { color: #37d67a; } .k-err { color: #ff6b6b; } .k-cmd { color: #7cc4ff; }
  #tabs { max-height: 26vh; overflow: auto; font-size: 12px; }
  .te { display: flex; gap: 8px; align-items: center; padding: 3px 4px; border-bottom: 1px dotted #262a31; cursor: pointer; }
  .te:hover { background: #1d2026; }
  .te .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .te .sz { color: #6f7681; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  #flist { max-height: 34vh; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .fe { display: flex; gap: 8px; padding: 3px 4px; border-bottom: 1px dotted #262a31; cursor: pointer; white-space: nowrap; }
  .fe:hover { background: #1d2026; }
  .fe .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .fe .sz { color: #6f7681; }
  .fe.d .nm { color: #7cc4ff; }
  #fview { max-height: 52vh; overflow: auto; }
  #fview pre { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; word-break: break-word; }
  #fview img { max-width: 100%; }
  #fview iframe, #fview embed { width: 100%; height: 60vh; border: 0; background: #fff; }
  #fview .md h1, #fview .md h2, #fview .md h3 { margin: 10px 0 4px; }
  #fview .md code { background: #22262e; padding: 1px 4px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; }
  #fview .md pre { background: #181b21; padding: 8px; border-radius: 6px; }
  #fview .md a { color: #7cc4ff; }
  #ftext { width: 100%; box-sizing: border-box; height: 52vh; background: #181b21; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.5; resize: vertical; tab-size: 2; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <strong>DSH Browser Bridge</strong>
  <span id="status" class="mut"></span>
</header>

<nav>
  <button id="tab-browser" class="on">浏览器</button>
  <button id="tab-files">文件</button>
</nav>

<!-- ── 浏览器 ───────────────────────────────────────────── -->
<div id="view-browser">
  <section>
    <div class="row">
      <label class="mut">桥地址</label>
      <input id="endpoint" style="flex:1">
      <button id="save">保存</button>
    </div>
    <div class="row"><label class="mut"><input type="checkbox" id="allowEval"> 允许 page.eval（默认关）</label></div>
  </section>

  <section>
    <div class="row">
      <button id="attach">连接当前标签页</button>
      <button id="snap">读取页面结构</button>
    </div>
    <div class="row">
      <input id="url" style="flex:1" placeholder="https://…">
      <button id="open">打开</button>
    </div>
    <div id="info" class="mut"></div>
  </section>

  <section>
    <div class="row">
      <strong>标签页</strong><span id="tcount" class="mut"></span>
      <button id="trefresh">刷新</button>
      <button id="tclose">关闭选中</button>
    </div>
    <div id="tabs" class="mut">点「刷新」列出全部标签页；单击一行可切到该页。</div>
  </section>

  <section>
    <div class="row"><strong>活动</strong><span id="count" class="mut"></span></div>
    <div id="log"></div>
  </section>
</div>

<!-- ── 文件 ─────────────────────────────────────────────── -->
<div id="view-files" hidden>
  <section>
    <div class="row">
      <input id="fpath" style="flex:1" placeholder="路径（留空 = 文件根）">
      <button id="fgo">打开</button>
      <button id="fup">上级</button>
    </div>
    <div id="fmeta" class="mut"></div>
  </section>

  <section>
    <div id="flist"></div>
  </section>

  <section>
    <div class="row">
      <strong id="fname" class="mut">预览</strong>
      <button id="fedit">编辑</button>
      <button id="fsave" hidden>保存</button>
      <button id="fdel" hidden>删除</button>
      <button id="fraw" hidden>新标签打开</button>
      <button id="fdl" hidden>下载</button>
    </div>
    <div class="row">
      <input id="fnew" style="flex:1" placeholder="新文件名（建在当前目录）">
      <button id="fnewgo">新建</button>
    </div>
    <div id="fview" class="mut">选一个文件，或让我把文件推到这里。</div>
    <textarea id="ftext" hidden spellcheck="false"></textarea>
  </section>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
